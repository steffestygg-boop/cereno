name: Publicera Cereno-sidan
on:
  # Kursjobbets git push använder GITHUB_TOKEN och utlöser därför inte ett nytt push-flöde.
  # Publicera om GitHub Pages när kursjobbet slutförts framgångsrikt.
  workflow_run:
    workflows: ["Uppdatera Cereno Scientific B aktiekurs"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
